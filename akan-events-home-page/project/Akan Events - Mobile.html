<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Akan Events — Mobile preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, #f3ead9 0%, #e6d6b8 60%, #d4bd96 100%);
      font-family: 'Manrope', system-ui, sans-serif;
      display: grid;
      place-items: center;
      padding: 40px 20px 60px;
      color: #1c130d;
      min-height: 100vh;
    }
    .wrap { text-align: center; }
    .tag {
      font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
      font-weight: 700;
      color: rgba(28,19,13,0.6);
      margin-bottom: 8px;
    }
    h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-weight: 400;
      font-size: 32px;
      letter-spacing: -0.015em;
      margin: 0 0 4px;
    }
    h1 em { color: #c96c4a; }
    p {
      font-size: 13.5px;
      color: rgba(28,19,13,0.7);
      max-width: 420px;
      margin: 0 auto 28px;
      line-height: 1.5;
    }
    .open-full {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 18px;
      background: #1c130d; color: #f3ead9;
      text-decoration: none;
      border-radius: 999px;
      font-size: 13px; font-weight: 600;
      margin-bottom: 24px;
    }
    .device {
      width: 402px; height: 824px;
      border-radius: 48px;
      background: #0b0805;
      padding: 12px;
      box-shadow:
        0 60px 120px -30px rgba(28,19,13,0.45),
        0 0 0 1px rgba(28,19,13,0.18),
        0 0 0 7px #1a120c,
        0 0 0 8px rgba(28,19,13,0.25);
      position: relative;
      margin: 0 auto;
    }
    .screen {
      width: 100%; height: 100%;
      border-radius: 38px;
      overflow: hidden;
      position: relative;
      background: #f3ead9;
    }
    .notch {
      position: absolute;
      top: 22px; left: 50%; transform: translateX(-50%);
      width: 126px; height: 36px;
      border-radius: 24px;
      background: #000;
      z-index: 10;
    }
    iframe {
      width: 100%; height: 100%;
      border: 0;
      display: block;
    }
    .caption {
      margin-top: 18px;
      font-size: 12px;
      color: rgba(28,19,13,0.55);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
    }
  </style>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <div class="wrap">
    <div class="tag">Akan Events · Mobile preview</div>
    <h1>The page on a <em>phone</em>.</h1>
    <p>The events page below is rendered inside an iPhone-sized viewport — scroll the device to browse it. Open the full page to see desktop layout.</p>
    <a class="open-full" href="Akan Events.html">Open full page →</a>
    <div class="device">
      <div class="notch"></div>
      <div class="screen">
        <iframe src="Akan Events.html" title="Akan Events on mobile"></iframe>
      </div>
    </div>
    <div class="caption">scroll the device to browse</div>
  </div>
</body>
</html>
